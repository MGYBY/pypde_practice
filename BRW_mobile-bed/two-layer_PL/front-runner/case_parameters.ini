# Front runner corresponding to the uploaded Basilisk v2p7a geometry/kinematics.
# PyPDE units: X=S0*x/H_l; T=S0*t*Ubar_l/H_l. All depths use H_l.
# This remains the ideal-power-law, no-capillarity SHALLOW-LAYER model.
[physical_problem]
froude_lower = 0.60
slope_tan = 0.06
depth_ratio = 1.0
density_ratio = 0.8
interfacial_apparent_viscosity_ratio = 1.544

[lower_rheology]
power_index = 0.40

[upper_rheology]
power_index = 0.80

[domain]
length_slope_scaled = 151.10
nx = 12000
boundary_type = periodic

[time_integration]
# Basilisk end_time=1500 translates to T=90, NOT 1500.
end_time_slope_scaled = 90.0
output_interval_slope_scaled = 1.0
# The guard is inspected at these exact segment endpoints (not each CFL step).
monitor_interval_slope_scaled = 0.05
cfl = 0.50
reconstruction_order = 2
numerical_flux = rusanov
stiff_source = false
n_threads = 1
# Reuse compiled callbacks; does not change the C++ ADER-WENO method.
cache_callbacks = true

[front_runner]
enabled = true
amplitude = 0.10
wavelength_slope_scaled = 2.0
center_wavelengths = 0.75
# Deliberately safer than the uploaded Basilisk case, which has this=false.
stop_before_wrap = true
boundary_guard_wavelengths = 0.25
boundary_guard_height = 0.01
# Diagnostic active-wave/positive-crest threshold, in depth units H_l.
tracking_height = 0.001

[periodic]
# Used ONLY when front_runner.enabled=false; does not affect front-runner IC.
initial_condition_mode = linear_eigenmode
amplitude = 0.001
# domain means one wave over the whole box, matching the original workflow.
wavelength_slope_scaled = domain
eigenmode_branch = free_surface
upper_layer_phase_shift = 0.0

[diagnostics]
preflight_every_cell = true
# Expensive sampled closure/hyperbolicity checks only at saved output frames.
runtime_cell_stride = 64
minimum_cells_per_support = 16

[output]
directory = front_runner_output
stem = two_layer_powerlaw_front_runner
postprocess = true
write_text_frames = true
max_plot_frames = 12
